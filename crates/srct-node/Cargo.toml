[package]
publish = false
name = "srct-node"
description = "Solar Cyber Unit node CLI: init, mine, send, status, verify, serve and export, with an opt-in REST API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
srct-core.workspace = true
srct-l2.workspace = true
srct-net.workspace = true
srct-store.workspace = true
srct-compute.workspace = true
srct-intent.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
subtle = "2.6"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
# Graceful shutdown: Ctrl-C/SIGTERM handler for `serve`.
ctrlc = "3.4"
# DoS guards on the service API: a per-request deadline, a cap on the number
# of requests admitted concurrently, and a per-IP rate limiter. §19.2 notes
# the API is non-consensus and opt-in; these keep it from being a
# self-inflicted DoS against the shared-state lock.
tower = { version = "0.5", features = ["limit", "timeout", "make", "util"] }
# The API's accept loop (manual, so the connection cap and hyper's header-read
# deadline are settable — `axum::serve` exposes neither): `server-auto` serves
# each connection, `service` adapts the tower Router into hyper's service
# trait, `tokio` brings the executor, the socket I/O bridge and the timer that
# arms the header-read timeout (a configured timeout panics without one).
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }

[dev-dependencies]
# The worker SDK, so the end-to-end journey can drive the real worker client
# against the real node path (`tests/e2e_journey.rs`).
srct-worker = { path = "../srct-worker" }
